[project]
name = "ua_compliance"
version = "0.0.1"
description = "Ukrainian legal layer for ERPNext/Frappe: NBU rates, effective-dated legal parameters, signed update channel"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Відступи табами — стиль самого Frappe, тому W191 і E101 вимкнені, як у нього.
ignore = ["E501", "W191", "E101"]

[tool.ruff.lint.per-file-ignores]
# Заготовки тестів створює сама платформа при створенні доктайпа — їхнє оформлення
# не наше, і правити його щоразу після генерації безглуздо.
"**/test_*.py" = ["I001"]

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
# Корінь репозиторію в sys.path — інакше `from ua_compliance...` не імпортується.
pythonpath = ["."]
# Збираємо лише власні тести: заготовки тестів доктайпів вимагають платформи
# і запускаються на стенді (`bench run-tests --app ua_compliance`), а не в CI.
testpaths = ["tests"]
