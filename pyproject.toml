[project]
name = "ua_compliance"
version = "0.0.1"
description = "Ukrainian legal layer for ERPNext/Frappe: NBU rates, effective-dated legal parameters, signed update channel"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
