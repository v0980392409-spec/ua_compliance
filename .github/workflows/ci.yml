name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install tools
        # cryptography і requests на стенді дає платформа, у CI їх треба поставити явно.
        run: pip install ruff pytest requests cryptography
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q ua_compliance tests tools
      - name: Unit tests
        run: pytest -q
